[package]
name = "dng_converter"
version = "0.1.0"
edition = "2021"
authors = ["jezehelfranca-svg"]
description = "High-performance standalone DNG to JPEG converter and Studio written in pure Rust"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff", "png"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true